name: CI

# Runs on every push and pull request. Deliberately does not build the Tauri
# bundle: that is minutes of work whose only new signal is packaging, and
# packaging is the release workflow's job.
on:
  push:
    branches: [main]
  pull_request:
  # So a run can be retried without an empty commit.
  workflow_dispatch:

# Read-only: nothing here publishes, and a token that cannot write is one that
# cannot be misused by a dependency running in a build script.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
# Cancelling it frees the runner instead of racing to tell you about old code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Test
        run: npm test

      # The runner is on UTC and a developer machine usually is not, which has
      # already cost one green-locally-red-on-CI afternoon: an assertion compared
      # against `getTimezoneOffset() * -60000`, which is `-0` in UTC, and `toBe`
      # uses Object.is. This second pass catches the same class of bug pointing
      # the other way — a test that only passes in UTC — in a repo full of
      # astronomy and scheduling maths.
      - name: Test in a non-UTC timezone
        run: npm test
        env:
          TZ: Asia/Kolkata

      # Catches a broken import or a chunk that stopped splitting, neither of
      # which the typecheck or the tests would notice.
      - name: Build
        run: npx vite build

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `cargo check` alone misses the tests, which is where the credential and
      # protocol logic is covered.
      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # Plain `cargo test` — not `--lib`. The integration tests in
      # `src-tauri/tests/` were invisible to CI while `--lib` was used, and one of
      # them is the guard on `capabilities/default.json`: a scope pattern without
      # a port silently blocks every local server, which is exactly the bug that
      # test exists to catch.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
