[package]
name = "devhelper"
version = "0.1.0"
description = "DevHelper — Your Everyday Developer Toolbox"
authors = ["DevHelper"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devhelper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
# Remembers window size and position between launches.
tauri-plugin-window-state = "2"
# One DevHelper at a time: the tray icon and the global hotkey both exist to
# raise the running window, and a second process makes both of them ambiguous.
tauri-plugin-single-instance = "2"
# Update checking. Inert until `plugins.updater` is configured in
# tauri.conf.json with a release feed and public key — see docs/UPDATES.md.
tauri-plugin-updater = "2"
# Opt-in password storage in the OS credential store (Windows Credential
# Manager here), so DevHelper still never writes a password to its own files.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# The NATS client protocol (port 4222), so the tool can publish and subscribe
# rather than only read the monitoring endpoints.
async-nats = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tokio-postgres = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
# native-tls => Windows SChannel: far more compatible with local SQL Server than rustls.
# winauth => Windows integrated (SSPI) authentication.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "winauth", "chrono", "rust_decimal"] }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
chrono = "0.4"
rust_decimal = "1"
uuid = { version = "1", features = ["v4"] }
# WebSocket client. native-tls matches the TLS stack already linked for SQL Server, and a
# native client (unlike the browser's WebSocket API) can set handshake headers such as
# Authorization — the reason this is not done in the webview.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Oracle is optional: the `oracle` crate needs Oracle Instant Client (ODPI-C) at build and
# runtime. Kept off the default build so DevHelper compiles without it. Enable with:
#   cargo build --features oracle   (Oracle Instant Client must be installed)
oracle = { version = "0.6", optional = true }

[features]
oracle = ["dep:oracle"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
