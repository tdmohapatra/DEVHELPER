[package]
name = "devhelper"
version = "0.1.0"
description = "DevHelper — Your Everyday Developer Toolbox"
authors = ["DevHelper"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devhelper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tokio-postgres = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
# native-tls => Windows SChannel: far more compatible with local SQL Server than rustls.
# winauth => Windows integrated (SSPI) authentication.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "winauth", "chrono", "rust_decimal"] }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
chrono = "0.4"
rust_decimal = "1"
uuid = "1"
# Oracle is optional: the `oracle` crate needs Oracle Instant Client (ODPI-C) at build and
# runtime. Kept off the default build so DevHelper compiles without it. Enable with:
#   cargo build --features oracle   (Oracle Instant Client must be installed)
oracle = { version = "0.6", optional = true }

[features]
oracle = ["dep:oracle"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
